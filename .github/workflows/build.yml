name: Build Android Debug APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK / NDK / CMake
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Fetch pinned libusb and libuac
        run: |
          set -euo pipefail
          mkdir -p app/src/main/cpp/vendor
          git clone --quiet --filter=blob:none https://github.com/libusb/libusb.git app/src/main/cpp/vendor/libusb
          git -C app/src/main/cpp/vendor/libusb checkout --quiet 15a7ebb4d426c5ce196684347d2b7cafad862626
          git clone --quiet --filter=blob:none https://github.com/nExtCamera/libuac.git app/src/main/cpp/vendor/libuac
          git -C app/src/main/cpp/vendor/libuac checkout --quiet 17a6ba0a09309a6890ec338826de43a256f89813
          test -f app/src/main/cpp/vendor/libusb/android/config.h
          test -f app/src/main/cpp/vendor/libuac/include/libuac.h
      - name: Instrument pinned libuac USB Isochronous failures
        run: |
          set -euo pipefail
          python3 scripts/patch_libuac.py
          grep -q RADIO_USB_ISO_DIAGNOSTICS_V1 app/src/main/cpp/vendor/libuac/src/uac_streaming.cpp
          grep -q RADIO_USB_AB13X_UAC1_INIT_V2 app/src/main/cpp/vendor/libuac/src/uac_streaming.cpp
      - name: Verify start-to-record regression
        run: |
          set -euo pipefail
          FILE=app/src/main/java/org/iu/radio/usbrecorder/MainActivity.kt
          grep -q 'MediaStore.Audio.Media.RELATIVE_PATH' "$FILE"
          grep -q 'NativeRecorder.start' "$FILE"
          if grep -q 'ACTION_CREATE_DOCUMENT' "$FILE"; then echo 'Save As regression detected'; exit 1; fi
      - name: Build arm64 debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Inspect APK contents
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/libradio_usb_recorder.so|lib/arm64-v8a/libusb.so|classes.dex'
          sha256sum "$APK" > "$APK.sha256"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: radio-usb-recorder-android-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          retention-days: 30
